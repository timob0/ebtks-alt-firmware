; PlatformIO Project Configuration File

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps = 
    SPI
    https://github.com/bblanchon/ArduinoJson.git
    https://github.com/gdsports/USBPrinter_t36.git
    https://github.com/gdsports/ESC_POS_Printer
;    https://github.com/A-Dunstan/teensy4_usbhost.git

build_flags = -fno-strict-aliasing
              -DSERIAL2_RX_BUFFER_SIZE=1024
              -Wl,--print-memory-usage
              -Wl,-Map,EBTKS.map

; Custom Serial Monitor port
monitor_port = /dev/cu.usbmodem141960601

; Custom Serial Monitor speed (baud rate)
monitor_speed = 115200
